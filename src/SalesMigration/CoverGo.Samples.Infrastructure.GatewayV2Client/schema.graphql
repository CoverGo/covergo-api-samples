  | QuoteMemberStateInvalidDatesError
  | QuoteMemberStatesDateOverlapError
  | QuoteMemberStatesDateNotAscOrderError
  | MemberDependentOfCycleError
  | MemberNotPrimaryError
  | MemberHasDependentsError
  | QuoteFinalizedError
  | InvalidFieldsError
  | QuoteProductCantHaveMultiplePrimariesError

union UpdateRenewalOpportunityOfferError =
  | BusinessRuleValidationError
  | MemberNotPrimaryError
  | MemberDependentOfCycleError
  | MemberHasDependentsError
  | OfferInImmutableStatusError
  | UniqueFieldError
  | EntityNotFoundError
  | InvalidFieldsError

union UpdateRenewalOpportunityProposalError =
  | MemberNotPrimaryError
  | MemberDependentOfCycleError
  | UniqueFieldError
  | InvalidProposalStatusError
  | EntityNotFoundError
  | SendDocumentsByEmailError
  | ProductCantHaveMultiplePrimariesError
  | InvalidFieldsError

union UpdateUnderwritingCaseLoadingError =
  | EntityNotFoundError
  | QuoteFinalizedError
  | LoadingTypeCannotBeChangedError
  | UnderwritingCaseLoadingEditNotAllowedError
  | InsufficientUnderwritingPermissionError

union UpdateUnderwritingCaseMemberBenefitLoadingError =
  | UnderwritingIsInFinalStatusError
  | EntityNotFoundError
  | AutoLoadingCannotBeUpdatedError
  | LoadingTypeCannotBeChangedError

union UpdateUnderwritingCaseMemberLoadingError =
  | EntityNotFoundError
  | ProposalMemberCanNotBeChangedError
  | AutoLoadingCannotBeUpdatedError
  | LoadingNotFoundError
  | LoadingTypeCannotBeChangedError
  | QuoteFinalizedError
  | UnderwritingCaseLoadingEditNotAllowedError

union ValidateOfferMemberUploadError =
  | EntityNotFoundError
  | OfferInImmutableStatusError
  | InvalidMemberUploadStatusError

union ValidateProposalMemberUploadError =
  | EntityNotFoundError
  | ProposalInImmutableStatusError
  | InvalidMemberUploadStatusError

