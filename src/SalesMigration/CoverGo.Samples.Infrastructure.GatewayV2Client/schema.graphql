  "What is in the document today."
  storedValue: String
  "What the recompute would write."
  computedValue: String
  "Which kind of difference — see ComputedFieldChange."
  change: String!
  "Runtime type of the stored value, e.g. Int64. Makes a TypeOnly difference readable."
  storedType: String
  "Runtime type of the computed value, e.g. String."
  computedType: String
}

"One member's differences. Only members with something to report are listed."
