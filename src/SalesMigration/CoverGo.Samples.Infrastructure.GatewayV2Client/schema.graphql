}

"What recompute-on-save would do to one offer, without doing any of it (CH-35817).\n            \nNothing in quotation has ever worked these values out — every calculated value stored today came\nfrom a browser. So the first save after the feature is switched on will quietly rewrite them, and nobody\ncurrently knows by how much for any tenant. This is how to find out before flipping the switch."
type DynamicFieldsDryRunResult {
  "Members examined."
  memberCount: Int!
  "Members whose stored values the recompute would leave exactly as they are."
  unchangedMemberCount: Int!
  "Members with at least one value that would be written differently. The headline number."
  affectedMemberCount: Int!
  "Members whose result cannot be trusted because the lookup workbook could not be fetched. Counted\nseparately rather than folded into the others: their blanks are not real changes, and treating them\nas such would be the difference between \"safe to enable\" and \"do not enable\"."
  inconclusiveMemberCount: Int!
  "Individual field values that would be written differently."
  changedFieldCount: Int!
  "Fields whose number is the same but whose stored type would change. See ComputedFieldChange.TypeOnly."
  typeOnlyFieldCount: Int!
  "Fields holding a value today that the recompute would blank."
  becameEmptyFieldCount: Int!
  "Fields empty today that the recompute would fill in."
  appearedFieldCount: Int!
  "The affected members themselves, capped by MaxAffectedMembers."
  affectedMembers: [DynamicFieldsDryRunMember!]!
}

