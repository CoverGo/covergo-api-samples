"Why a calculated field came out the way it did — the question a bare null cannot answer (CH-35817)."
enum CalculatedFieldStatus {
  "Worked out from the formula. The value stands, even if it is empty by its own logic."
  COMPUTED
  "A declared dependency was unset, so the formula never ran — the same gate the browser applies. By\nfar the most common reason for a null, and rarely a defect."
  EMPTY_DEPENDENCY
  "A formula the backend cannot evaluate. The data is fine; the answer just cannot be produced here,\nand storing this null would destroy whatever the browser worked out."
  UNSUPPORTED_FORMULA
  "The expression threw. A bug somewhere, and never safe to store."
  ERROR
}

