"The `Date` scalar represents an ISO-8601 compliant date type."
scalar Date

"The `Long` scalar type represents non-fractional signed whole 64-bit numeric values. Long can represent values between -(2^63) and 2^63 - 1."
scalar Long

"The `DateTime` scalar represents an ISO-8601 compliant date time type."
scalar DateTime

scalar JSON

"The built-in `Decimal` scalar type."
scalar Decimal

"The `Byte` scalar type represents non-fractional whole numeric values. Byte can represent values between 0 and 255."
scalar Byte

scalar URL

"Delegates a resolver to a remote schema."
directive @delegate(
  "The path to the field on the remote schema."
  path: String
  "The name of the schema to which this field shall be delegated to."
  schema: String!
) on FIELD_DEFINITION

"Annotates the original name of a type."
directive @source(
  "The original name of the annotated type."
  name: String!
  "The name of the schema to which this type belongs to."
  schema: String!
) repeatable on
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | INTERFACE
  | UNION
  | ENUM
  | ENUM_VALUE
  | INPUT_OBJECT
  | INPUT_FIELD_DEFINITION

directive @authorize(
  "The name of the authorization policy that determines access to the annotated resource."
  policy: String
  "Roles that are allowed to access the annotated resource."
  roles: [String!]
  "Defines when when the authorize directive shall be applied.By default the authorize directives are applied during the validation phase."
  apply: ApplyPolicy! = BEFORE_RESOLVER
) repeatable on OBJECT | FIELD_DEFINITION