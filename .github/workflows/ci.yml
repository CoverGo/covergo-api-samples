name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single job composed of composite actions. A matrix or reusable workflow would
  # spawn extra runners for no benefit at this size.
  ci:
    name: Build, test and scan
    runs-on: ubuntu-latest
    # Every step runs inside the .NET SDK image rather than on the host runner.
    container: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      # Checkout must precede the local composite action, which is read from the workspace.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nx compares against the merge base, so it needs the history.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # checkout fetches the pull request's merge ref only, so it leaves no
      # origin/<base> tracking ref for nx affected to diff against. Without this,
      # nx fails with "Could not access 'origin/main'".
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      # On a pull request only what the branch touched needs rebuilding. On a push to
      # main there is no meaningful base to diff against, so everything runs.
      - name: Build and test affected projects
        if: github.event_name == 'pull_request'
        run: |
          npx nx affected -t build --base=origin/${{ github.base_ref }}
          npx nx affected -t lint  --base=origin/${{ github.base_ref }}
          npx nx affected -t test  --base=origin/${{ github.base_ref }}

      - name: Build and test all projects
        if: github.event_name != 'pull_request'
        run: |
          npx nx run-many -t build
          npx nx run-many -t lint
          npx nx run-many -t test

  # Kept separate: this scans the repository, not the build output, and it must report even
  # when the build fails.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Scanning history, not just the tip: a credential removed in a later commit is
          # still a leaked credential.
          fetch-depth: 0

      # The gitleaks CLI, not gitleaks-action: the action requires a paid licence key for
      # repositories owned by an organisation, while the tool itself is open source. This
      # runs the same scanner without one.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for committed credentials
        run: gitleaks git . --redact --no-banner --exit-code 1
